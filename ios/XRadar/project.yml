# XcodeGen spec — the single source of truth for XRadar.xcodeproj.
# The .xcodeproj is generated (git-ignored): run `xcodegen generate` after
# pulling or after adding/removing files.
name: XRadar

options:
  bundleIdPrefix: com.xradar
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  XRadarKit:
    path: Packages/XRadarKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.30.0

settingGroups:
  common:
    base:
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1"

targets:
  XRadar:
    type: application
    platform: iOS
    sources:
      - path: XRadar
    dependencies:
      - package: XRadarKit
        product: XRadarCore
      - package: XRadarKit
        product: XRadarData
      - package: MapLibre
        product: MapLibre
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: XRadar
        PRODUCT_BUNDLE_IDENTIFIER: com.xradar.app
        INFOPLIST_FILE: XRadar/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Xcode 26 defaults: UI code is main-actor by default, background work opts out.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  XRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XRadarTests
    dependencies:
      - target: XRadar
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xradar.app.tests
        GENERATE_INFOPLIST_FILE: YES

  XRadarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: XRadarUITests
    dependencies:
      - target: XRadar
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xradar.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  XRadar:
    build:
      targets:
        XRadar: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - XRadar
      targets:
        - XRadarTests
        - XRadarUITests
        - package: XRadarKit/XRadarDataTests
    archive:
      config: Release
