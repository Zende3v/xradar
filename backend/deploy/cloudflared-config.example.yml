# Option "Cloudflare Tunnel" (recommandée) : aucun port ouvert sur le VPS,
# l'IP du serveur reste cachée derrière Cloudflare, HTTPS gratuit et automatique.
# Fichier cible sur le VPS : /etc/cloudflared/config.yml
# Remplace <TUNNEL_ID> et le domaine.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: api.VOTRE-DOMAINE.fr
    service: http://127.0.0.1:8090
  - service: http_status:404
